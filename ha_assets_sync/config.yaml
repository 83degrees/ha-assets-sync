name: "HA Assets Sync"
version: "0.1.0"
slug: "ha_assets_sync"
description: "Safely replicate the public ha-assets repository into Home Assistant local static storage."
url: "https://github.com/83degrees/ha-assets-sync"
arch:
  - aarch64
  - amd64
startup: application
boot: auto
init: false
map:
  - type: homeassistant_config
    read_only: false
    path: /homeassistant
options:
  repository: "83degrees/ha-assets"
  branch: "main"
  sync_interval: 3600
schema:
  repository: str
  branch: str
  sync_interval: int(300,86400)
